name: Open Source Hygiene
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracked-files:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked files for accidental secrets and runtime state
        run: node scripts/check-open-source.mjs
