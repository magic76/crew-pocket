name: Vendor Pixel Agents sprites
on:
  push:
    branches: [feat/upstream-pixel-agents-office-20261019]
    paths:
      - 'scripts/sync-pixel-assets.mjs'
      - '.github/workflows/vendor-pixel-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy pinned Pixel Agents assets
        run: node scripts/sync-pixel-assets.mjs
      - name: Verify asset integrity
        run: node scripts/sync-pixel-assets.mjs --check
      - name: Commit self-hosted sprites to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/vendor/pixel-agents/assets
          if ! git diff --cached --quiet; then
            git commit -m "chore(pixel): vendor upstream art for offline office"
            git push origin HEAD:${{ github.ref_name }}
          fi
