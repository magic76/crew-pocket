name: Check Crew Pocket MCP
on:
  pull_request:
    paths:
      - 'lib/mcp/**'
      - 'lib/memory/dreaming.js'
      - 'lib/crew-messages.js'
      - 'lib/crew-auto-response.js'
      - 'server.js'
      - 'mcp/**'
      - 'test/mcp-*'
      - '.github/workflows/mcp-p0.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CREW_UPLOADS_DIR: ${{ github.workspace }}/.ci-uploads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check lib/mcp/agent-tools.js
          node --check lib/mcp/memory-candidates.js
          node --check lib/mcp/tasks.js
          node --check lib/mcp/task-runner.js
          node --check lib/memory/dreaming.js
          node --check lib/crew-messages.js
          node --check lib/crew-auto-response.js
          node --check server.js
          node --check test/mcp-p1-p2.test.js
          node --check mcp/server.mjs
          node --check test/mcp-core.test.js
          node --check test/mcp-stdio.test.js
          node --check test/mcp-codex-integration.test.js
      - name: Install isolated MCP dependencies
        run: npm install --prefix mcp --omit=dev --no-audit --no-fund
      - name: Run MCP and affected memory/role regressions
        run: |
          node --test test/mcp-*.test.js test/memory-provenance.test.js test/role-runtime.test.js
      # The broader repository suite requires jsdom and Android-specific paths.
      # It is not a portable Linux CI gate yet.
