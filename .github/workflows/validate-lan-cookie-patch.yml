name: Validate LAN cookie patch

on:
  push:
    branches:
      - fix/runtime-safety-concurrency
    paths:
      - scripts/apply-lan-cookie-patch.py
      - .github/workflows/validate-lan-cookie-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-safety-concurrency
          fetch-depth: 0

      - name: Apply server patch
        run: python3 scripts/apply-lan-cookie-patch.py

      - name: Syntax check runtime files
        run: |
          node --check server.js
          node --check lib/http-security.js
          node --check lib/providers/index.js
          node --check lib/session.js
          node --check lib/extension_bridge.js
          node --check public/js/app.js
          node --check public/js/chat.js
          node scripts/prepare-pwa-cache.js --check

      - name: Commit validated sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-lan-cookie-patch.yml scripts/apply-lan-cookie-patch.py
          git add -A
          git commit -m "fix: keep LAN image and event requests authenticated"
          git push origin HEAD:fix/runtime-safety-concurrency
