name: Actions artifact cleanup

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report eligible artifacts without deleting them'
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: actions-artifact-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    steps:
      - name: Check out cleanup policy
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan and clean expired artifacts
        run: node .github/scripts/cleanup-actions-artifacts.mjs
