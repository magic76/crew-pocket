name: Crew World 3D Lab
on:
  pull_request:
    branches: [main]
    paths:
      - "public/world-lab.html"
      - "public/css/world-lab.css"
      - "public/js/world-lab*.js"
      - "public/vendor/three.min.js"
      - "public/vendor/THREE-LICENSE.txt"
      - "test/world-lab.test.js"
      - ".github/workflows/world-lab.yml"
  workflow_dispatch:
jobs:
  world-lab-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check standalone 3D demo and syntax
        run: node test/world-lab.test.js
