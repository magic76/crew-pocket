name: Check Crew Runtime

on:
  push:
    branches:
      - main
      - feature/agent-runtime
  pull_request:
    branches:
      - main
    paths:
      - "scripts/*.sh"
      - "lib/**/*.js"
      - "test/*.js"
      - "scripts/*.js"
      - "server.js"
      - "install.sh"
      - "public/js/*.js"
      - ".github/workflows/runtime-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/android-runtime-start.sh
          bash -n scripts/android-runtime-stop.sh
          bash -n scripts/update-provider.sh

      - name: Check runtime JavaScript
        run: |
          node --check lib/runtime/codex-transport.js
          node --check lib/runtime/provider-manager.js
          node --check lib/conversation-settings.js
          node --check lib/projects.js
          node --check lib/roles.js
          node --check lib/role-delete.js
          node --check lib/crew-messages.js
          node --check lib/mission-graph.js
          node --check test/mission-graph.test.js
          node test/mission-graph.test.js
          node --check lib/role-runtime.js
          node --check lib/role-message-queue.js
          node --check lib/role-submit.js
          node test/role-submit.test.js
          node test/role-submit-chat.test.js
          node --check lib/crew-status.js
          node --check lib/crew-auto-response.js
          node --check lib/context-builder.js
          node --check lib/context/types.js
          node --check lib/context/estimator.js
          node --check lib/context/health.js
          node --check lib/context/compaction.js
          node --check lib/context/state.js
          node --check lib/context/index.js
          node --check lib/memory/types.js
          node --check lib/memory/provider.js
          node --check lib/memory/local-memory-provider.js
          node --check lib/memory/openviking-adapter.js
          node --check lib/memory/index.js
          node --check lib/memory/dreaming.js
          node --check test/dreaming.test.js
          node test/dreaming.test.js
          node --check test/role-memory-kernel.test.js
          node --check test/memory-provenance.test.js
          node --check test/context-health.test.js
          node --check test/context-compaction.test.js
          node --check test/role-centric-navigation.test.js
          node --check test/navigation-simplification.test.js
          node --check test/live-role-direct-message.test.js
          node --check test/crew-roster-grid.test.js
          node --check test/crew-role-messaging.test.js
          node --check test/role-runtime.test.js
          node --check test/role-message-queue.test.js
          node --check test/role-runtime-kernel-v2.test.js
          node --check test/role-delete-lifecycle.test.js
          node --check test/crew-status.test.js
          node --check test/crew-auto-response.test.js
          node test/role-memory-kernel.test.js
          node test/memory-provenance.test.js
          node --check lib/memory/local-memory-provider.js
          node --check test/memory-xray.test.js
          node test/memory-xray.test.js
          node test/context-health.test.js
          node test/context-compaction.test.js
          node test/role-centric-navigation.test.js
          node test/navigation-simplification.test.js
          node test/live-role-direct-message.test.js
          node test/crew-roster-grid.test.js
          node --check test/crew-room.test.js
          node test/crew-room.test.js
          node test/crew-role-messaging.test.js
          node test/role-runtime.test.js
          node test/role-message-queue.test.js
          node test/role-runtime-kernel-v2.test.js
          node test/role-delete-lifecycle.test.js
          node test/crew-status.test.js
          node test/crew-auto-response.test.js
          node --check scripts/crew-tool.js
          node --check lib/runtime/agy-transport.js
          node --check public/js/user-content.js
          node --check test/execution-intent-user-boundary.test.js
          CREW_UPLOADS_DIR=/tmp/crew-pocket-ci node test/execution-intent-user-boundary.test.js
          node --check lib/providers/codex.js
          node --check lib/providers/codex-usage.js
          node --check scripts/report-codex-cache.js
          node --check test/codex-usage.test.js
          node --test test/codex-usage.test.js
          node --check lib/model-runtime.js
          node --check lib/execution-intent.js
          node --check lib/runtime/turn-orchestrator.js
          node --check lib/turn-result.js
          node --check test/runtime-orchestrator.test.js
          node --check test/execution-result-ui.test.js
          node test/runtime-orchestrator.test.js
          node test/execution-result-ui.test.js
          node --check public/js/living-ui.js
          node --check test/living-ui.test.js
          node test/living-ui.test.js
          node -e "const i=require('./lib/execution-intent'); const x=i.normalizeExecutionIntent({summary:'x',expected_files:5,estimated_tools:14,needs_build:true,needs_dependency_change:false,destructive:false,broad_refactor:false,confidence:.8}); const p={mode:'SURGICAL_EDIT',allowWrite:true,maxFilesChanged:3,hardToolExecutions:12,allowBuild:false,allowDependencyChanges:false}; const c=i.policyConflicts(x,p); if(!c.includes('file_scope')||!c.includes('tool_budget')||!c.includes('build_not_allowed')) process.exit(1); const base={provider:'codex',model:'gpt-6-luna',executionPolicy:p,explicitExecutionMode:null,continuation:false}; if(i.shouldCreateExecutionIntent({...base,prompt:'修一下這個按鈕'})) process.exit(1); if(!i.shouldCreateExecutionIntent({...base,prompt:'refactor the entire project'})) process.exit(1)"
          CREW_UPLOADS_DIR=/tmp/crew-pocket-ci node -e "const p=require('./lib/providers/codex'); const c=require('./lib/config'); const m=require('./lib/model-runtime'); if(typeof p.steerActiveTurn!=='function'||typeof p.warmup!=='function'||typeof p.stopWarmup!=='function'||typeof p.getWarmupStatus!=='function') process.exit(1); if(c.cleanUserContent('<ADDITIONAL_METADATA>runtime only</ADDITIONAL_METADATA>').trim()!=='') process.exit(1); if(!m.isLunaModel('gpt-5.6-luna')||!m.isLunaModel('gpt-6-luna')||m.isLunaModel('gpt-5.6-terra')) process.exit(1); if(m.getDefaultModel('codex')!=='gpt-5.6-terra'||c.AVAILABLE_MODELS.find(x=>x.provider==='codex'&&x.isDefault)?.id!==m.getDefaultModel('codex')) process.exit(1)"
          node --check lib/providers/antigravity.js
          node --check lib/history.js
          node --check lib/compact.js
          node --check lib/session.js
          node --check lib/auth.js
          node --check lib/config.js
          node --check lib/files.js
          node --check lib/sandbox.js
          node --check lib/storage.js
          node --check lib/workspaces.js
          node --check server.js
          node --check lib/visual-answer.js
          node --check lib/vendor/answer-me-with-html/am.mjs
          node --check test/visual-answer.test.js
          node test/visual-answer.test.js
          node --check test/visual-answer-inline.test.js
          node test/visual-answer-inline.test.js
          node --check test/ui-theme-design.test.js
          node test/ui-theme-design.test.js
          node --check public/js/cockpit-model.js
          node --check public/js/cockpit.js
          node --check test/crew-cockpit.test.js
