name: Check Crew Runtime

on:
  push:
    branches:
      - main
      - feature/agent-runtime
  pull_request:
    branches:
      - main
    paths:
      - "scripts/*.sh"
      - "lib/**/*.js"
      - "server.js"
      - "install.sh"
      - "public/js/*.js"
      - ".github/workflows/runtime-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n scripts/android-runtime-start.sh
          bash -n scripts/android-runtime-stop.sh
          bash -n scripts/update-provider.sh

      - name: Check runtime JavaScript
        run: |
          node --check lib/runtime/codex-transport.js
          node --check lib/runtime/provider-manager.js
          node --check lib/runtime/agy-transport.js
          node --check lib/providers/codex.js
          node --check lib/jev-router.js
          node --check lib/execution-intent.js
          node --check lib/runtime-decision.js
          node --check lib/runtime/turn-orchestrator.js
          node -e "const r=require('./lib/jev-router'); const x=r.extractChoice({answers:{execution_mode:{choice:'DEBUG',confidence:0.91}}}); const y=r.extractNamedChoice({answers:{intent_review:{choice:'REJECT_SCOPE',confidence:0.88}}},['intent_review']); if(x.mode!=='DEBUG'||x.confidence!==0.91||y.choice!=='REJECT_SCOPE'||y.confidence!==0.88||!r.looksLikeContinuation('做吧')) process.exit(1)"
          node -e "const i=require('./lib/execution-intent'); const x=i.normalizeExecutionIntent({summary:'x',expected_files:5,estimated_tools:14,needs_build:true,needs_dependency_change:false,destructive:false,broad_refactor:false,confidence:.8}); const p={mode:'SURGICAL_EDIT',allowWrite:true,maxFilesChanged:3,hardToolExecutions:12,allowBuild:false,allowDependencyChanges:false}; const c=i.policyConflicts(x,p); if(!c.includes('file_scope')||!c.includes('tool_budget')||!c.includes('build_not_allowed')) process.exit(1)"
          node -e "const d=require('./lib/runtime-decision'); const f=d.parseToolFailureResult({answers:{failure_type:{choice:'AUTH',confidence:.9},retry_same:{choice:'NO',confidence:.9},try_alternative:{choice:'NO',confidence:.8},likely_transient:{choice:'NO',confidence:.8},task_on_track:{choice:'YES',confidence:.9},escalation:{choice:'NONE',confidence:.9},ask_user:{choice:'YES',confidence:.95},should_stop:{choice:'YES',confidence:.9},stuck_risk:{choice:'HIGH',confidence:.8},learning_value:{choice:'LOW',confidence:.7}}},123); const s=d.parseSoftBudgetResult({answers:{goal_progress:{choice:'HIGH'},root_cause_found:{choice:'YES'},solution_found:{choice:'YES'},remaining_work:{choice:'TINY'},approach_working:{choice:'YES'},finish_within_hard_budget:{choice:'YES'},action:{choice:'CONTINUE'},ask_user:{choice:'NO'},stuck_risk:{choice:'LOW'}}},45); if(f.failureType!=='AUTH'||f.retrySame||!f.askUser||!f.shouldStop||s.action!=='CONTINUE'||s.remainingWork!=='TINY'||!d.shouldUseRuntimeSnapshots({provider:'codex',model:'gpt-5.6-luna'})) process.exit(1)"
          node -e "const d=require('./lib/runtime-decision'); const x=d.parseElapsedCheckpointResult({answers:{goal_alignment:{choice:'YES',confidence:.9},recent_context_consistency:{choice:'YES',confidence:.9},scope_control:{choice:'GOOD',confidence:.8},approach_progress:{choice:'SLOW',confidence:.8},loop_risk:{choice:'MEDIUM',confidence:.7},context_sufficient:{choice:'YES',confidence:.9},next_action_fit:{choice:'REPLAN',confidence:.9},replan_needed:{choice:'YES',confidence:.9},ask_user:{choice:'NO',confidence:.9},decision:{choice:'REPLAN',confidence:.95}}},77); if(x.type!=='ELAPSED_CHECKPOINT'||x.decision!=='REPLAN'||!x.replanNeeded||x.askUser||!x.contextSufficient||x.latencyMs!==77) process.exit(1)"
          CREW_UPLOADS_DIR=/tmp/crew-pocket-ci node -e "const p=require('./lib/providers/codex'); const c=require('./lib/config'); if(typeof p.steerActiveTurn!=='function'||typeof p.warmup!=='function'||typeof p.stopWarmup!=='function'||typeof p.getWarmupStatus!=='function') process.exit(1); if(c.cleanUserContent('<ADDITIONAL_METADATA>runtime only</ADDITIONAL_METADATA>').trim()!=='') process.exit(1)"
          node -e "const o=require('./lib/runtime/turn-orchestrator'); const accepted={accepted:true,decision:'KEEP_CURRENT'}; const rejected={accepted:true,decision:'REJECT_SCOPE'}; if(o.reviewOutcome(accepted,{id:'a'})!=='ACCEPT'||o.reviewOutcome(rejected,{id:'a'})!=='REPLAN'||o.reviewOutcome({accepted:false},null)!=='BLOCK') process.exit(1)"
          node --check lib/providers/antigravity.js
          node --check lib/session.js
          node --check lib/auth.js
          node --check lib/config.js
          node --check lib/files.js
          node --check lib/sandbox.js
          node --check lib/storage.js
          node --check lib/workspaces.js
          node --check server.js
          for file in public/js/*.js; do node --check "$file"; done
