name: Build Android Wrapper

on:
  push:
    branches:
      - main
      - feature/agent-runtime
      - feature/companion-runtime
  pull_request:
    branches:
      - main
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-wrapper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle -p android-wrapper :app:assembleDebug :runtime:assembleDebug --stacktrace

      - name: Upload Crew Pocket APK
        uses: actions/upload-artifact@v4
        with:
          name: crew-pocket-android-wrapper-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Crew Runtime APK
        uses: actions/upload-artifact@v4
        with:
          name: crew-pocket-runtime-debug
          path: android-wrapper/runtime/build/outputs/apk/debug/runtime-debug.apk
