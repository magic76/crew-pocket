name: Apply runtime safety patch

on:
  push:
    branches:
      - fix/runtime-safety-concurrency
    paths:
      - scripts/apply-runtime-safety-patch.py
      - .github/workflows/runtime-safety-patch.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/runtime-safety-concurrency
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/apply-runtime-safety-patch.py

      - name: Synchronize PWA cache metadata
        run: node scripts/prepare-pwa-cache.js

      - name: Syntax check changed JavaScript
        run: |
          node --check server.js
          node --check lib/http-security.js
          node --check lib/session.js
          node --check lib/providers/index.js
          node --check lib/extension_bridge.js
          node --check public/js/app.js
          node --check public/js/chat.js
          node scripts/prepare-pwa-cache.js --check

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/runtime-safety-patch.yml scripts/apply-runtime-safety-patch.py
          git add -A
          git commit -m "fix: harden runtime security and turn isolation"
          git push origin HEAD:fix/runtime-safety-concurrency
