<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d14" />
  <title>Crew Forge</title>
  <link rel="stylesheet" href="/forge/forge.css" />
</head>
<body>
  <main id="homeView" class="shell">
    <section class="hero">
      <div class="brand-row">
        <div class="brand-mark">✦</div>
        <div>
          <div class="eyebrow">CREW FORGE</div>
          <h1>Describe it.<br />Use it. Change it.</h1>
        </div>
      </div>
      <p class="hero-copy">Turn a small need into a working mini app. No setup, no build, no install.</p>

      <div class="forge-box">
        <textarea id="promptInput" rows="4" placeholder="What do you need right now?&#10;Example: Make a scoreboard for two kids. First to 10 wins."></textarea>
        <div class="forge-actions">
          <span>⌘ / Ctrl + Enter</span>
          <button id="forgeBtn" class="primary-btn">Forge app <b>→</b></button>
        </div>
      </div>

      <div class="starter-row" aria-label="Starter ideas">
        <button data-starter="Make a simple scoreboard for two kids. Let me rename both players. First to 10 wins, vibrate on every point, celebrate the winner, and remember the score.">Kids scoreboard</button>
        <button data-starter="Make a fast decision wheel. I can add and remove choices, spin it, and it remembers my choices.">Decision wheel</button>
        <button data-starter="Make a focused presentation timer for a 15 minute talk with checkpoints at 5, 10, and 14 minutes.">Talk timer</button>
      </div>
    </section>

    <section class="library-section">
      <div class="section-heading">
        <div>
          <div class="eyebrow">YOUR APPS</div>
          <h2>Recently forged</h2>
        </div>
        <span>Stored on this device</span>
      </div>
      <div id="library" class="library"></div>
    </section>
  </main>

  <main id="appView" class="app-shell" hidden>
    <header class="app-bar">
      <button id="backBtn" class="icon-btn" aria-label="Back">←</button>
      <div class="app-title-wrap">
        <div class="eyebrow">CREW FORGE</div>
        <strong id="appTitle">App</strong>
      </div>
      <button id="versionBtn" class="icon-btn" aria-label="Version">•••</button>
    </header>

    <section class="preview-frame">
      <iframe id="preview" title="Generated app preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-downloads"></iframe>
    </section>

    <nav class="forge-toolbar">
      <button id="undoBtn" class="toolbar-btn">↶ <span>Undo</span></button>
      <button id="modifyOpenBtn" class="modify-open-btn">✦ Modify</button>
    </nav>
  </main>

  <div id="modifySheet" class="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Modify app">
      <div class="sheet-handle"></div>
      <div class="sheet-title-row">
        <div>
          <div class="eyebrow">MODIFY</div>
          <h2>What should change?</h2>
        </div>
        <button id="modifyCloseBtn" class="icon-btn">×</button>
      </div>
      <textarea id="modifyInput" rows="4" placeholder="Example: Make the buttons bigger and add fireworks when someone reaches 10."></textarea>
      <button id="modifyBtn" class="primary-btn wide">Apply changes <b>→</b></button>
    </section>
  </div>

  <div id="statusOverlay" class="status-backdrop" hidden>
    <section class="status-card">
      <div class="forge-loader"><i></i><i></i><i></i></div>
      <div>
        <strong id="statusTitle">Forging your app</strong>
        <span id="statusDetail">Preparing the builder…</span>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/forge/forge.js"></script>
</body>
</html>
