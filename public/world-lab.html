<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b32">
  <title>Crew World — 3D 試驗場</title>
  <link rel="stylesheet" href="/css/world-lab.css">
</head>
<body>
  <main id="world-app" class="world-app">
    <div class="world-stage-frame">
      <div id="world-stage" aria-label="可縮放、平移的 3D Crew World 場景">
        <div id="world-districts" aria-label="專案工作區域"></div>
        <div id="world-labels" aria-label="Crew Role 對話回覆"></div>
        <div id="world-loading" role="status">正在建立 3D 世界…</div>
      </div>
    </div>
    <header class="world-header">
      <a href="/" id="world-back" class="world-back" aria-label="返回 Crew Pocket 小隊">←</a>
      <div class="world-brand"><span class="world-kicker">CREW POCKET / EXPERIMENT 01</span><h1>Crew World <span>3D LAB</span></h1></div>
      <span class="world-demo-pill">獨立示範 · 非即時狀態</span>
    </header>
    <div class="world-hint">拖曳移動 · 雙指縮放 · 點人物選擇</div>
    <div id="world-status-strip" class="world-status-strip" role="status" aria-live="polite">讀取小隊狀態中…</div>
    <!-- Real saved messages only; this is a flight cue, NOT delivery proof. -->
    <button id="world-flight-notice" class="world-flight-notice" type="button"
      aria-label="查看剛記錄的角色協作訊息" hidden>
      <span class="world-flight-notice-plane" aria-hidden="true">✈</span>
      <span id="world-flight-notice-text" class="world-flight-notice-text">已記錄角色訊息</span>
      <span class="world-flight-notice-action">查看 ›</span>
    </button>
    <!-- Runtime-verified Role state only; tool-level steps remain in original Chat. -->
    <div id="world-focus-activity" class="world-focus-activity" role="status" aria-live="polite" hidden>
      <span id="world-focus-activity-dot" class="world-focus-activity-dot" aria-hidden="true"></span>
      <span id="world-focus-activity-text" class="world-focus-activity-text">狀態未同步</span>
      <button id="world-focus-activity-open" type="button">查看對話</button>
    </div>
    <button id="world-handoffs-open" class="world-handoffs-open" type="button" aria-controls="world-handoffs-panel" aria-expanded="false" hidden>協作紀錄</button>
    <section id="world-handoffs-panel" class="world-handoffs-panel" aria-label="已保存的角色間訊息" hidden>
      <div class="world-handoffs-heading">
        <div><strong>最近協作</strong><small>僅顯示已保存的訊息，不代表送達或完成</small></div>
        <button id="world-handoffs-close" type="button" aria-label="關閉協作紀錄">✕</button>
      </div>
      <div id="world-handoffs-list" class="world-handoffs-list" role="list">
        <p>尚無已確認的協作紀錄</p>
      </div>
    </section>
    <section id="world-district-picker" class="world-district-picker" role="dialog" aria-label="選擇工作室成員" hidden>
      <div class="world-district-picker-head">
        <strong id="world-district-picker-name">工作室成員</strong>
        <button id="world-district-picker-close" type="button" aria-label="關閉成員選單">✕</button>
      </div>
      <div id="world-district-picker-list" class="world-district-picker-list"></div>
    </section>
    <section id="world-info" class="world-info" aria-live="polite">
      <div class="world-info-head">
        <div class="world-portrait" id="world-portrait">P</div>
        <div><span class="world-caption">SELECTED AGENT</span><h2 id="world-role-name">Pocket Developer</h2><p id="world-role-state">正在等待示範動作</p></div>
        <div class="world-info-actions">
          <button type="button" id="world-info-quick-focus" aria-label="聚焦選中角色">聚焦</button>
          <button type="button" id="world-info-toggle" aria-expanded="true" aria-controls="world-role-description">詳情</button>
        </div>
      </div>
      <p class="world-context-health" id="world-role-context" aria-live="polite">Context · 展開詳情後讀取</p>
      <p class="world-description" id="world-role-description">選擇人物，體驗同一套 Low-poly 骨架在不同 Role 上的效果。</p>
      <div class="world-action-row">
        <button type="button" id="world-focus">聚焦人物</button>
        <button type="button" id="world-work">示範工作</button>
        <button type="button" id="world-handoff">示範交接</button>
        <button type="button" id="world-chat-open" hidden>在 Crew Pocket 中聊天</button>
        <button type="button" id="world-open-role" hidden>前往對話</button>
      </div>
    </section>
    <footer class="world-bottom">
      <div class="world-roster" id="world-roster" aria-label="切換示範角色"></div>
      <div class="world-controls">
        <button type="button" id="world-zoom-out" aria-label="縮小">−</button>
        <button type="button" id="world-reset">世界全景</button>
        <button type="button" id="world-zoom-in" aria-label="放大">＋</button>
      </div>
    </footer>
    <div id="world-toast" class="world-toast" role="status" aria-live="polite"></div>
    <noscript>此 Demo 需要啟用 JavaScript。</noscript>
  </main>
  <script src="/vendor/three.min.js"></script>
  <script src="/js/world-lab-kit.js"></script>
  <script src="/js/world-lab-events.js"></script>
  <script src="/js/world-lab.js"></script>
</body>
</html>
