<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101b32">
  <title>Crew World — 3D 試驗場</title>
  <link rel="stylesheet" href="/css/world-lab.css">
</head>
<body>
  <main id="world-app" class="world-app">
    <div id="world-stage" aria-label="可縮放、平移的 3D Crew World 場景">
      <div id="world-labels" aria-label="Crew Role 對話回覆"></div>
      <div id="world-loading" role="status">正在建立 3D 世界…</div>
    </div>
    <header class="world-header">
      <a href="/" id="world-back" class="world-back" aria-label="返回 Crew Pocket 小隊">←</a>
      <div class="world-brand"><span class="world-kicker">CREW POCKET / EXPERIMENT 01</span><h1>Crew World <span>3D LAB</span></h1></div>
      <span class="world-demo-pill">獨立示範 · 非即時狀態</span>
    </header>
    <div class="world-hint">拖曳移動 · 雙指縮放 · 點人物選擇</div>
    <section id="world-info" class="world-info" aria-live="polite">
      <div class="world-info-head">
        <div class="world-portrait" id="world-portrait">P</div>
        <div><span class="world-caption">SELECTED AGENT</span><h2 id="world-role-name">Pocket Developer</h2><p id="world-role-state">正在等待示範動作</p></div>
      </div>
      <p class="world-description" id="world-role-description">選擇人物，體驗同一套 Low-poly 骨架在不同 Role 上的效果。</p>
      <div class="world-action-row">
        <button type="button" id="world-focus">聚焦人物</button>
        <button type="button" id="world-work">示範工作</button>
        <button type="button" id="world-handoff">示範交接</button>
        <button type="button" id="world-chat-open" hidden>跟他說話</button>
        <button type="button" id="world-open-role" hidden>前往對話</button>
      </div>
    </section>
    <section id="world-chat-sheet" class="world-chat-sheet" role="dialog" aria-modal="true" aria-labelledby="world-chat-title" hidden>
      <div class="world-chat-header">
        <div><span class="world-caption">DIRECT ROLE MESSAGE</span><h2 id="world-chat-title">跟 Role 說話</h2></div>
        <button type="button" id="world-chat-close" aria-label="關閉傳話面板">✕</button>
      </div>
      <p class="world-chat-help">這裡同步顯示這位 Role 的最近對話。直接輸入即可在同一個 Conversation 指派下一項任務。</p>
      <div id="world-chat-history" class="world-chat-history" role="log" aria-live="polite" aria-label="這位角色的最近對話"></div>
      <div id="world-chat-read-state" class="world-chat-read-state" role="status">尚未同步對話</div>
      <form id="world-chat-form">
        <label for="world-chat-message">訊息</label>
        <textarea id="world-chat-message" rows="3" maxlength="5000" placeholder="告訴這位 Role 下一件事…" required></textarea>
        <div id="world-chat-feedback" role="status" aria-live="polite"></div>
        <div class="world-chat-buttons"><button type="button" id="world-chat-conversation">查看完整對話</button><button id="world-chat-submit" type="submit">送出訊息</button></div>
      </form>
    </section>
    <footer class="world-bottom">
      <div class="world-roster" id="world-roster" aria-label="切換示範角色"></div>
      <div class="world-controls">
        <button type="button" id="world-zoom-out" aria-label="縮小">−</button>
        <button type="button" id="world-reset">世界全景</button>
        <button type="button" id="world-zoom-in" aria-label="放大">＋</button>
      </div>
    </footer>
    <div id="world-toast" class="world-toast" role="status" aria-live="polite"></div>
    <noscript>此 Demo 需要啟用 JavaScript。</noscript>
  </main>
  <script src="/vendor/three.min.js"></script>
  <script src="/js/world-lab-kit.js"></script>
  <script src="/js/world-lab-events.js"></script>
  <script src="/js/world-lab-chat.js"></script>
  <script src="/js/world-lab.js"></script>
</body>
</html>
