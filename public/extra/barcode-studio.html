<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>條碼合成工作室</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#080b14;--panel:#111827;--line:#273449;--text:#e8eef9;--muted:#91a0b8;--accent:#76e4c1;--accent2:#7c8cff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#1b2546 0,#080b14 42%);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;min-height:100dvh}
    .app{width:min(1120px,100%);margin:auto;padding:18px 14px 30px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--accent),#536bff);display:grid;place-items:center;color:#061018;font-size:22px;font-weight:900;box-shadow:0 8px 30px #45e6bd2b}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:800}.title{margin:2px 0 0;font-size:21px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px}.card{background:#0e1523d9;border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 50px #0004}.stage-card{padding:12px}.stage{position:relative;width:100%;aspect-ratio:3/4;max-height:74dvh;overflow:hidden;border-radius:15px;background:#182235;touch-action:none;display:grid;place-items:center}.stage canvas{width:100%;height:100%;display:block}.hint{position:absolute;inset:auto 12px 12px;background:#050914c9;border:1px solid #ffffff1c;color:#b9c7db;border-radius:12px;padding:9px 11px;font-size:12px;pointer-events:none}.panel{padding:18px}.label{display:block;color:#c9d5e9;font-size:13px;font-weight:700;margin:0 0 8px}.drop{border:1.5px dashed #53627a;border-radius:15px;padding:16px;text-align:center;cursor:pointer;background:#0a111e;transition:.2s}.drop:active,.drop:hover{border-color:var(--accent);background:#11222a}.drop strong{display:block;color:var(--accent);font-size:17px;margin-bottom:3px}.drop small{color:var(--muted)}input[type=file]{display:none}.field{width:100%;min-height:48px;border:1px solid #33425b;border-radius:13px;background:#0a111e;color:var(--text);padding:0 13px;font:inherit;outline:none}.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px #76e4c11c}.section{margin-bottom:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.button{width:100%;min-height:48px;border:0;border-radius:13px;padding:0 14px;font-weight:800;font:inherit;cursor:pointer;transition:.15s}.button:active{transform:scale(.98)}.primary{background:linear-gradient(135deg,var(--accent),#58b7ff);color:#061018}.secondary{background:#1c2940;color:#dce7fa;border:1px solid #33425b}.status{color:var(--muted);font-size:12px;line-height:1.55;margin-top:9px}.tip{display:flex;gap:9px;color:#afbed3;background:#0a111e;border-radius:13px;padding:12px;font-size:12px;line-height:1.55}.tip b{color:var(--accent)}.footer{color:#66758c;text-align:center;font-size:11px;margin-top:14px}
    @media(max-width:760px){.app{padding:12px 10px 24px}.grid{grid-template-columns:1fr}.stage{aspect-ratio:4/5;max-height:none}.panel{padding:15px}.top{margin-bottom:11px}.title{font-size:18px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="brand-mark">▥</div><div><div class="eyebrow">CREW POCKET TOOL</div><h1 class="title">條碼合成工作室</h1></div></div><button class="button secondary" id="resetBtn" style="width:auto;min-height:42px">重設</button></header>
    <div class="grid">
      <section class="card stage-card"><div class="stage" id="stage"><canvas id="canvas" width="900" height="1200"></canvas><div class="hint" id="hint">拖曳條碼移動；拖右下角圓點自由拉伸</div></div></section>
      <aside class="card panel">
        <div class="section"><label class="label">1. 上傳底圖</label><label class="drop" for="imageInput"><strong>＋ 選擇圖片</strong><small id="fileName">支援 JPG、PNG、WEBP</small></label><input id="imageInput" type="file" accept="image/*"></div>
        <div class="section"><label class="label" for="barcodeText">2. 輸入手機條碼文字</label><input class="field" id="barcodeText" value="/ABC1234" placeholder="例如：/ABC1234" autocomplete="off" spellcheck="false"><div class="status" id="status">目前格式：Code 128 · 條碼文字已隱藏</div></div>
        <div class="section"><label class="label" for="bgOpacity">3. 條碼背景透明度 <span id="opacityValue" style="color:var(--accent);float:right">100%</span></label><input id="bgOpacity" type="range" min="0" max="100" value="100" style="width:100%;accent-color:var(--accent);min-height:40px"><div class="status">背景為白色圓角 12px，可調整透明程度</div></div>
        <div class="section row"><button class="button secondary" id="centerBtn">置中條碼</button><button class="button secondary" id="hideBtn">隱藏框線</button></div>
        <div class="section"><button class="button primary" id="downloadBtn">下載合成 PNG</button></div>
        <div class="tip"><b>操作</b><span>在預覽區拖曳條碼可換位置；拖曳右下角圓點可以獨立調整寬、高。雙指操作也能在手機上使用。</span></div>
      </aside>
    </div>
    <div class="footer">圖片只在你的瀏覽器本機處理，不會上傳伺服器。</div>
  </main>
  <svg id="barcodeSvg" xmlns="http://www.w3.org/2000/svg" style="display:none"></svg>
  <script>
    const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage');
    const input=document.getElementById('imageInput'),textInput=document.getElementById('barcodeText'),svg=document.getElementById('barcodeSvg');
    const state={image:null,x:330,y:470,w:240,h:115,drag:false,resize:false,dx:0,dy:0,showBox:true};
    function makeBarcode(){
      try{JsBarcode(svg,textInput.value.trim()||'BARCODE',{format:'CODE128',displayValue:false,margin:8,lineColor:'#101827',background:'transparent',height:92});document.getElementById('status').textContent='目前格式：Code 128 · 條碼文字已隱藏';return true}
      catch(e){document.getElementById('status').textContent='條碼內容無法產生，請檢查輸入文字';return false}
    }
    function svgImage(){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(svg))})}
    function contain(img,w,h){const r=Math.min(w/img.width,h/img.height);return {w:img.width*r,h:img.height*r}}
    async function render(){
      ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#182235';ctx.fillRect(0,0,canvas.width,canvas.height);
      if(state.image){const s=contain(state.image,canvas.width,canvas.height);ctx.drawImage(state.image,(canvas.width-s.w)/2,(canvas.height-s.h)/2,s.w,s.h)}else{ctx.fillStyle='#26344d';ctx.fillRect(70,150,760,900);ctx.fillStyle='#9aacbf';ctx.textAlign='center';ctx.font='700 30px system-ui';ctx.fillText('請先上傳一張圖片',450,585);ctx.font='20px system-ui';ctx.fillText('你的圖片會顯示在這裡',450,625)}
      if(!makeBarcode())return;
      ctx.save();
      ctx.fillStyle=`rgba(255,255,255,${Number(document.getElementById('bgOpacity').value)/100})`;
      const radius=12;
      ctx.beginPath();ctx.moveTo(state.x+radius,state.y);ctx.lineTo(state.x+state.w-radius,state.y);ctx.quadraticCurveTo(state.x+state.w,state.y,state.x+state.w,state.y+radius);ctx.lineTo(state.x+state.w,state.y+state.h-radius);ctx.quadraticCurveTo(state.x+state.w,state.y+state.h,state.x+state.w-radius,state.y+state.h);ctx.lineTo(state.x+radius,state.y+state.h);ctx.quadraticCurveTo(state.x,state.y+state.h,state.x,state.y+state.h-radius);ctx.lineTo(state.x,state.y+radius);ctx.quadraticCurveTo(state.x,state.y,state.x+radius,state.y);ctx.closePath();ctx.fill();ctx.restore();
      try{const b=await svgImage();ctx.drawImage(b,state.x,state.y,state.w,state.h)}catch(e){}
      if(state.showBox){ctx.save();ctx.strokeStyle='#76e4c1';ctx.lineWidth=4;ctx.setLineDash([12,8]);ctx.strokeRect(state.x,state.y,state.w,state.h);ctx.setLineDash([]);ctx.fillStyle='#76e4c1';ctx.beginPath();ctx.arc(state.x+state.w,state.y+state.h,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#071018';ctx.beginPath();ctx.arc(state.x+state.w,state.y+state.h,6,0,Math.PI*2);ctx.fill();ctx.restore()}
    }
    input.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{state.image=img;document.getElementById('fileName').textContent=file.name;render()};img.src=URL.createObjectURL(file)});
    textInput.addEventListener('input',render);
    document.getElementById('bgOpacity').addEventListener('input',e=>{document.getElementById('opacityValue').textContent=e.target.value+'%';render()});
    function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
    stage.addEventListener('pointerdown',e=>{const p=point(e),near=p.x>state.x+state.w-42&&p.y>state.y+state.h-42;if(near){state.resize=true;state.dx=state.x+state.w-p.x;state.dy=state.y+state.h-p.y}else if(p.x>=state.x&&p.x<=state.x+state.w&&p.y>=state.y&&p.y<=state.y+state.h){state.drag=true;state.dx=p.x-state.x;state.dy=p.y-state.y}else return;stage.setPointerCapture(e.pointerId);document.getElementById('hint').style.display='none'});
    stage.addEventListener('pointermove',e=>{if(!state.drag&&!state.resize)return;const p=point(e);if(state.drag){state.x=Math.max(0,Math.min(canvas.width-state.w,p.x-state.dx));state.y=Math.max(0,Math.min(canvas.height-state.h,p.y-state.dy))}else{state.w=Math.max(90,Math.min(canvas.width-state.x,p.x-state.x+state.dx));state.h=Math.max(55,Math.min(canvas.height-state.y,p.y-state.y+state.dy))}render()});
    stage.addEventListener('pointerup',()=>{state.drag=false;state.resize=false});stage.addEventListener('pointercancel',()=>{state.drag=false;state.resize=false});
    document.getElementById('centerBtn').onclick=()=>{state.x=(canvas.width-state.w)/2;state.y=(canvas.height-state.h)/2;render()};
    document.getElementById('hideBtn').onclick=e=>{state.showBox=!state.showBox;e.currentTarget.textContent=state.showBox?'隱藏框線':'顯示框線';render()};
    document.getElementById('resetBtn').onclick=()=>{state.image=null;state.x=330;state.y=470;state.w=240;state.h=115;input.value='';document.getElementById('fileName').textContent='支援 JPG、PNG、WEBP';textInput.value='/ABC1234';document.getElementById('hint').style.display='block';render()};
    document.getElementById('downloadBtn').onclick=async()=>{const old=state.showBox;state.showBox=false;await render();const a=document.createElement('a');a.download='barcode-composite.png';a.href=canvas.toDataURL('image/png');a.click();state.showBox=old;render()};
    render();
  </script>
</body>
</html>
