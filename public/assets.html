<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <title>Crew Pocket · HTML 頁面</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-[100dvh] bg-slate-950 text-slate-100">
  <main class="mx-auto min-h-[100dvh] max-w-3xl px-4 pb-8 pt-[max(1rem,env(safe-area-inset-top))]">
    <header class="mb-5 flex items-start justify-between gap-3">
      <div>
        <p class="text-[10px] font-bold tracking-[0.2em] text-teal-400">CREW POCKET</p>
        <h1 class="mt-1 text-xl font-bold text-white">HTML 頁面</h1>
        <p id="status" class="mt-1 text-xs text-slate-400">正在掃描 public/ 中的 HTML 頁面…</p>
      </div>
      <a href="/" class="min-h-10 rounded-xl border border-slate-700 bg-slate-900 px-3 py-2 text-xs font-medium text-slate-200 active:scale-95">回主對話</a>
    </header>

    <div class="sticky top-0 z-10 -mx-4 border-y border-slate-800 bg-slate-950/95 px-4 py-3 backdrop-blur">
      <input id="search" type="search" autocomplete="off" placeholder="搜尋 HTML 檔名或路徑…" class="h-11 w-full rounded-xl border border-slate-700 bg-slate-900 px-3 text-sm text-white outline-none placeholder:text-slate-500 focus:border-teal-400">
    </div>
    <section id="page-list" class="mt-4 space-y-2" aria-live="polite"></section>
  </main>

  <section id="preview" class="fixed inset-0 z-50 hidden bg-slate-950">
    <header class="flex min-h-14 items-center gap-3 border-b border-slate-800 bg-slate-950 px-3 pt-[env(safe-area-inset-top)]">
      <button id="close-preview" type="button" class="min-h-10 shrink-0 rounded-xl border border-teal-500/50 bg-teal-500/15 px-3 text-xs font-semibold text-teal-200 active:scale-95">← 返回清單</button>
      <span id="preview-title" class="min-w-0 flex-1 truncate text-sm font-semibold text-slate-200"></span>
    </header>
    <iframe id="preview-frame" class="h-[calc(100dvh-3.5rem-env(safe-area-inset-top))] w-full border-0 bg-white" title="HTML 預覽"></iframe>
  </section>

  <script>
    let pages = [];
    const search = document.getElementById('search');
    const list = document.getElementById('page-list');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    const previewFrame = document.getElementById('preview-frame');
    const previewTitle = document.getElementById('preview-title');

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character]);
    }

    function renderList() {
      const keyword = search.value.trim().toLocaleLowerCase();
      const visible = pages.filter(page => !keyword || `${page.name} ${page.path}`.toLocaleLowerCase().includes(keyword));
      if (!visible.length) {
        list.innerHTML = '<div class="rounded-2xl border border-dashed border-slate-700 p-8 text-center text-sm text-slate-500">找不到符合的 HTML 頁面。</div>';
        return;
      }
      list.innerHTML = visible.map(page => `
        <button type="button" data-preview-url="${page.url}" data-preview-title="${escapeHtml(page.name)}" class="flex min-h-16 w-full items-center gap-3 rounded-2xl border border-slate-800 bg-slate-900/70 px-3 py-2.5 text-left transition active:scale-[0.99] hover:border-teal-500/50">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-800 text-lg">🌐</span>
          <span class="min-w-0 flex-1">
            <span class="block truncate text-sm font-semibold text-slate-100">${escapeHtml(page.name)}</span>
            <span class="mt-0.5 block truncate font-mono text-[10px] text-slate-500">/${escapeHtml(page.path)}</span>
          </span>
          <span class="shrink-0 text-right text-[10px] text-slate-500"><span class="block text-teal-300">預覽</span>${escapeHtml(page.sizeFormatted)}</span>
        </button>`).join('');
    }

    list.addEventListener('click', event => {
      const button = event.target.closest('[data-preview-url]');
      if (!button) return;
      previewTitle.textContent = button.dataset.previewTitle;
      previewFrame.src = button.dataset.previewUrl;
      preview.classList.remove('hidden');
    });
    document.getElementById('close-preview').addEventListener('click', () => {
      preview.classList.add('hidden');
      previewFrame.src = 'about:blank';
    });
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !preview.classList.contains('hidden')) document.getElementById('close-preview').click();
    });
    search.addEventListener('input', renderList);

    fetch('/api/public-assets', { cache: 'no-store' })
      .then(response => response.ok ? response.json() : Promise.reject(new Error(`HTTP ${response.status}`)))
      .then(data => {
        if (!data.success) throw new Error(data.error || '掃描失敗');
        pages = data.assets || [];
        status.textContent = `已找到 ${data.count} 個 HTML 頁面 · 點一下在此預覽`;
        renderList();
      })
      .catch(error => {
        status.textContent = '無法讀取 HTML 頁面';
        list.innerHTML = `<div class="rounded-2xl border border-rose-500/30 bg-rose-500/10 p-4 text-sm text-rose-200">${escapeHtml(error.message)}</div>`;
      });
  </script>
</body>
</html>
